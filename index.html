<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./src/style.css">
    <title>Title</title>
    <script>
        // Enable Tailwind dark mode
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            light: '#2C7EF8',
                            'hover-light': '#075CD9',
                            dark: '#3A86F8',
                            'hover-dark': '#6BA4FA'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body>
<header class="flex justify-between items-center">
<div>
    <button>کوئرا لیست</button>
    <button>صفحه اصلی</button>
    <button>درباره ما</button>
    <button>ارتباط با ما</button>
</div>
<div class="p-6 bg-white dark:bg-gray-900 flex items-center gap-4 transition-colors duration-300">
    <button
            id="toggle-mode"
            class="px-3 py-2 bg-primary-light dark:bg-primary-dark text-white rounded-md transition-colors duration-300 flex items-center gap-2">
        <img id="mode-icon" src="src/assets/icons/dark_icon.png" alt="mode icon" class="w-5 h-5">
        Toggle Dark Mode
    </button>
</div>
</header>
<script src="./src/main.js"></script>
</body>
</html>
