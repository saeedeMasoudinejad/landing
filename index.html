<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./src/style.css">
    <title>Title</title>
    <script>
        // Enable Tailwind dark mode
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            light: '#2C7EF8',
                            'hover-light': '#075CD9',
                            // 'primary-light': '#2C7EF8',
                            // 'primary-hover-light': '#075CD9',
                            'on-light': '#FFFFFF',
                            'background-light': '#FFFFFF',
                            'on-background-light': '#191C1E',
                            'surface-light': '#FFFFFF',
                            'neutral-9': '#F5F6F8',
                            dark: '#3A86F8',
                            'hover-dark': '#6BA4FA',
                            'on-Dark': '#FFFFFF',
                            // 'primary-Dark': '#3A86F8',
                            // 'primary-hover-Dark': '#6BA4FA',
                            'background-Dark': '#040810',
                            'on-background-Dark': '#E6E9EF',
                            'surface-Dark': '#E6E9EF',
                        },
                        secondary: {
                            'background-dark': '#0B192D',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-primary-background-light dark:bg-primary-background-Dark text-primary-on-background-light dark:text-primary-on-background-Dark">
<header class="flex justify-between items-center">
    <div>
        <button>کوئرا لیست</button>
        <button>صفحه اصلی</button>
        <button>درباره ما</button>
        <button>ارتباط با ما</button>
    </div>
    <div class="p-6 flex items-center justify-between transition-colors duration-300">
        <button
                id="toggle-mode"
                class="px-3 py-2 text-white rounded-md transition-colors duration-300 flex items-center gap-2">
            <img id="mode-icon" src="src/assets/icons/dark_icon.png" alt="mode icon">
        </button>
    </div>
</header>
<script src="./src/main.js"></script>
</body>
</html>
