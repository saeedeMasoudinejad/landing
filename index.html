<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./src/style.css">
    <title>Title</title>
    <script>
        // Enable Tailwind dark mode
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            light: '#FFFFFF',
                            'hover-light': '#075CD9',
                            dark: '#060C18',
                            'hover-dark': '#6BA4FA'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-primary-light dark:bg-primary-dark">
<header class="flex justify-between items-center">
<div>
    <button>کوئرا لیست</button>
    <button>صفحه اصلی</button>
    <button>درباره ما</button>
    <button>ارتباط با ما</button>
</div>
<div class="p-6 flex items-center justify-between transition-colors duration-300">
    <button
            id="toggle-mode"
            class="px-3 py-2 text-white rounded-md transition-colors duration-300 flex items-center gap-2">
        <img id="mode-icon" src="src/assets/icons/dark_icon.png" alt="mode icon">
    </button>
</div>
</header>
<script src="./src/main.js"></script>
</body>
</html>
